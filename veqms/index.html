<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VeQMS</title>
  <meta name="description" content="VeQMS electronic quality management system by Katalyze Data: frontend prototype with sample data.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" type="image/svg+xml" href="img/katalyze-marque-digital.svg">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem('veqms-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app" class="app">
    <nav id="rail" class="rail" aria-label="Main"></nav>
    <div class="main-col">
      <header id="topbar" class="topbar"></header>
      <div id="banner"></div>
      <main id="main" class="content" tabindex="-1"></main>
    </div>
    <nav id="tabbar" class="tabbar" aria-label="Mobile"></nav>
  </div>
  <div id="drawer-root"></div>
  <div id="palette-root"></div>
  <div id="popover-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

  <script src="js/core.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/esign.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/today.js"></script>
  <script src="js/views/documents.js"></script>
  <script src="js/views/training.js"></script>
  <script src="js/views/changes.js"></script>
  <script src="js/views/reviews.js"></script>
  <script src="js/views/quality.js"></script>
  <script src="js/views/analytics.js"></script>
  <script src="js/views/admin.js"></script>
  <script src="js/views/misc.js"></script>
  <script src="js/views/approvals.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
