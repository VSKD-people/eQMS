# Deploys the VeQMS prototype (veqms/) to Azure Static Web Apps.
# Sign-in is enforced by veqms/staticwebapp.config.json (Microsoft Entra ID).
# Needs the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN. See DEPLOY.md.
name: Deploy VeQMS prototype

on:
  push:
    branches: [main]
    paths: ['veqms/**', '.github/workflows/deploy-veqms.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: veqms
          skip_app_build: true
          skip_api_build: true
